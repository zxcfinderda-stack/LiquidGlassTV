
name: Build Liquid Glass TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip LiquidGlassTV-source.zip -d source

      - name: Build APK
        run: gradle -p source/LiquidGlassTV assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTV-APK
          path: source/LiquidGlassTV/app/build/outputs/apk/debug/app-debug.apk

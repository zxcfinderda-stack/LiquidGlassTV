
name: Build Liquid Glass TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip LiquidGlassTV-source.zip -d source

      - name: Fix Java color literal
        run: sed -i 's/0x553FFFFFF/0x553FFFFF/g' source/LiquidGlassTV/app/src/main/java/com/akwe/liquidglasstv/MainActivity.java

      - name: Build APK
        run: gradle -p source/LiquidGlassTV assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTV-APK
          path: source/LiquidGlassTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
